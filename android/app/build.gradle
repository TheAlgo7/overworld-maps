plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.plugin.compose'
}

// Personal settings, never committed: the TomTom key and the Play upload key's location.
def props = new Properties()
def localProps = rootProject.file("local.properties")
if (localProps.exists()) localProps.withInputStream { props.load(it) }

android {
    namespace 'com.thealgothrim.overworld'
    compileSdk = 36

    defaultConfig {
        applicationId "com.thealgothrim.overworld"
        // The Car App Library needs 29 (Android 10).
        minSdk 29
        targetSdk 36
        versionCode 5
        versionName "0.3.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // Live traffic (TomTom free tier). Put tomtomKey=... in local.properties.
        buildConfigField "String", "TOMTOM_KEY", "\"${props.getProperty("tomtomKey", "")}\""
    }

    // Google Play upload key (uploadStoreFile, uploadStorePassword, uploadKeyAlias, uploadKeyPassword
    // in local.properties). Play re-signs releases with its own key. Without these, release builds
    // come out unsigned.
    signingConfigs {
        upload {
            if (props.getProperty("uploadStoreFile")) {
                storeFile file(props.getProperty("uploadStoreFile"))
                storePassword props.getProperty("uploadStorePassword")
                keyAlias props.getProperty("uploadKeyAlias")
                keyPassword props.getProperty("uploadKeyPassword")
            }
        }
    }

    buildTypes {
        // Test builds install next to the Play copy (their own package and name), so testing over
        // USB never means uninstalling the app in the car.
        debug {
            applicationIdSuffix ".debug"
        }
        release {
            minifyEnabled false
            if (props.getProperty("uploadStoreFile")) signingConfig signingConfigs.upload
        }
    }
    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures {
        compose true
        buildConfig true
    }
    sourceSets {
        // Personal-use game fonts live in src/local (gitignored). Missing files fall back to free fonts.
        main { assets.srcDirs += 'src/local/assets' }
    }
    packagingOptions {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

def ferrostar = '0.57.0'

// MapLibre's default Android build renders with Vulkan, and the Snapdragon Vulkan driver on
// Gaurav's Galaxy S24 Ultra fails to compile its shaders (only the background drew). Use the
// OpenGL build of the same version instead.
configurations.configureEach {
    exclude group: 'org.maplibre.gl', module: 'android-sdk'
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'

    implementation 'androidx.core:core-ktx:1.17.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.10.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.10.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.10.0'
    implementation 'androidx.activity:activity-compose:1.13.0'

    implementation platform('androidx.compose:compose-bom:2026.02.01')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.material3:material3'

    implementation 'androidx.car.app:app:1.7.0'

    implementation "com.stadiamaps.ferrostar:core:$ferrostar"
    implementation "com.stadiamaps.ferrostar:car-app:$ferrostar"
    implementation "com.stadiamaps.ferrostar:google-play-services:$ferrostar"
    implementation "com.stadiamaps.ferrostar:ui-compose:$ferrostar"
    implementation "com.stadiamaps.ferrostar:ui-formatters:$ferrostar"
    implementation "com.stadiamaps.ferrostar:ui-maplibre:$ferrostar"
    implementation "com.stadiamaps.ferrostar:ui-maplibre-car-app:$ferrostar"

    implementation 'org.maplibre.compose:maplibre-compose-android:0.13.0'
    implementation 'org.maplibre.gl:android-sdk-opengl:13.0.2'
    implementation 'io.github.rallista:car-app-compose:0.0.2'
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.11.0'

    implementation platform('com.squareup.okhttp3:okhttp-bom:5.3.2')
    implementation 'com.squareup.okhttp3:okhttp'

    implementation 'com.google.android.gms:play-services-location:21.3.0'

    testImplementation 'junit:junit:4.13.2'

    androidTestImplementation 'androidx.car.app:app-testing:1.7.0'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test:runner:1.7.0'
}
